<style>
  :root{
    --paper:#f4f1ea;--ink:#1c1b18;--muted:#6b6760;--line:#d8d2c5;--card:#fffdf8;--accent:#1b4d3e;
    --c1:#c0392b;--c2:#2563a8;--c3:#b8862b;--c4:#7a756c;
    --shadow:0 1px 2px rgba(28,27,24,.06),0 12px 32px -12px rgba(28,27,24,.18);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--paper);color:var(--ink);font-family:'Archivo',sans-serif;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;background-image:radial-gradient(circle at 1px 1px, rgba(28,27,24,.045) 1px, transparent 0);
    background-size:22px 22px;padding:30px 18px 56px;display:flex;justify-content:center}
  .wrap{width:100%;max-width:600px}
  header{text-align:center;margin-bottom:26px}
  .kicker{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:12px}
  h1{font-family:'Fraunces',serif;font-weight:900;font-size:clamp(28px,7vw,42px);line-height:1.04;letter-spacing:-.01em}
  .panel{background:var(--card);border:1.5px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:34px 28px;animation:rise .5s ease both}
  .panel .lead{text-align:center;color:var(--muted);font-size:14.5px;line-height:1.5;margin-bottom:20px}
  .lock{width:64px;height:64px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-size:28px;margin:0 auto 18px}
  input[type=password]{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:15px 16px;font-size:16px;font-family:inherit;background:#fff;outline:none}
  input[type=password]:focus{border-color:var(--ink)}
  .btn{margin-top:14px;width:100%;border:none;border-radius:13px;background:var(--ink);color:var(--paper);font-family:inherit;font-weight:700;font-size:16px;padding:15px;cursor:pointer;transition:transform .12s ease}
  .btn:hover:not(:disabled){transform:translateY(-2px)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .err{background:#fbeae8;border:1px solid #e7b7b1;color:#8c2f23;border-radius:11px;padding:11px 14px;font-size:13.5px;text-align:center;margin-top:14px}
  .total{text-align:center;color:var(--muted);font-size:14px;margin:4px 0 24px}
  .total b{color:var(--ink);font-size:17px}
  .bar-row{margin-bottom:22px}
  .bar-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
  .bar-name{font-weight:700;font-size:16px;display:flex;align-items:center;gap:11px}
  .mini{width:34px;height:34px;border-radius:50%;flex:0 0 34px;display:inline-block}
  .mini.photo{background-size:cover;background-position:center}
  .m1{background:var(--c1)}.m2{background:var(--c2)}.m3{background:var(--c3)}.m4{background:var(--c4)}
  .pct{font-family:'Fraunces',serif;font-weight:900;font-size:22px}
  .track{height:15px;background:#e7e1d4;border-radius:100px;overflow:hidden}
  .fill{height:100%;width:0;border-radius:100px;transition:width 1s cubic-bezier(.22,1,.36,1)}
  .f1{background:var(--c1)}.f2{background:var(--c2)}.f3{background:var(--c3)}.f4{background:var(--c4)}
  .sub{font-size:12.5px;color:var(--muted);margin-top:5px}
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
  .refresh{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:9px 16px;font-family:inherit;font-weight:600;font-size:13.5px;cursor:pointer;color:var(--ink)}
  .refresh:hover{border-color:var(--ink)}
  .stamp{font-size:12px;color:var(--muted)}
  .loading{text-align:center;color:var(--muted);padding:30px 0;font-size:14px}
  .spinner{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;margin:0 auto 14px;animation:spin .8s linear infinite}
  footer{text-align:center;margin-top:30px;color:var(--muted);font-size:11.5px}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>

];
const BLANK = { id:"blanco", name:"Voto en blanco / Ninguno", role:"", n:4 };
const ALL = [...CANDIDATES, BLANK];

const stage = document.getElementById("stage");
let PASS = null;

function escapeHtml(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

async function getResultados(pass){
  const r = await fetch(SUPABASE_URL+"/rest/v1/rpc/get_resultados",{method:"POST",
    headers:{"apikey":SUPABASE_ANON_KEY,"Authorization":"Bearer "+SUPABASE_ANON_KEY,"Content-Type":"application/json"},
    body:JSON.stringify({p_password:pass})});
  if(!r.ok) throw new Error("Supabase "+r.status);
  return r.json(); // null si la clave es incorrecta
}

function renderLogin(msg){
  stage.innerHTML = `<div class="panel">
    <div class="lock">🔒</div>
    <p class="lead">Este panel es privado. Ingresá tu contraseña para ver los resultados.</p>
    <input type="password" id="pass" placeholder="Contraseña" autocomplete="off">
    <button class="btn" id="enter">Ver resultados</button>
    ${msg?`<div class="err">${msg}</div>`:""}
  </div>`;
  const inp = document.getElementById("pass");
  const go = ()=>intentar(inp.value);
  document.getElementById("enter").addEventListener("click", go);
  inp.addEventListener("keydown", e=>{ if(e.key==="Enter") go(); });
  inp.focus();
}

async function intentar(pass){
  if(!pass) return;
  const btn = document.getElementById("enter");
  btn.disabled = true; btn.textContent = "Verificando…";
  try{
    const data = await getResultados(pass);
    if(!data){ renderLogin("Contraseña incorrecta. Intentá de nuevo."); return; }
    PASS = pass;
    renderResultados(data);
  }catch(e){
    renderLogin("No se pudo conectar. Revisá tu internet e intentá de nuevo.");
  }
}

function renderResultados(data){
  const total = data.total || 0;
  const ranked = [...ALL].sort((a,b)=>(data[b.id]||0)-(data[a.id]||0));
  let html = `<div class="panel">
    <div class="total">Total de votos: <b>${total}</b></div>`;
  ranked.forEach(c=>{
    const v = data[c.id]||0;
    const pct = total ? Math.round(1000*v/total)/10 : 0;
    const mini = c.photo
      ? `<span class="mini photo" style="background-image:url('${c.photo}')"></span>`
      : `<span class="mini m${c.n}"></span>`;
    html += `<div class="bar-row">
      <div class="bar-head"><span class="bar-name">${mini}${escapeHtml(c.name)}</span><span class="pct">${pct}%</span></div>
      <div class="track"><div class="fill f${c.n}" data-pct="${pct}"></div></div>
      <div class="sub">${v} ${v===1?"voto":"votos"}</div>
    </div>`;
  });
  const ahora = new Date().toLocaleString("es-AR");
  html += `<div class="toolbar">
      <button class="refresh" id="refresh">🔄 Actualizar</button>
      <span class="stamp">Actualizado: ${ahora}</span>
    </div></div>`;
  stage.innerHTML = html;
  document.getElementById("refresh").addEventListener("click", recargar);
  requestAnimationFrame(()=>setTimeout(()=>{
    stage.querySelectorAll(".fill").forEach(f=>f.style.width=f.dataset.pct+"%");
  },80));
}

async function recargar(){
  const btn = document.getElementById("refresh");
  btn.textContent = "Actualizando…";
  try{ const data = await getResultados(PASS); if(data) renderResultados(data); }
  catch(e){ btn.textContent = "🔄 Actualizar"; }
}

renderLogin();
</script>
</body>
</html>
